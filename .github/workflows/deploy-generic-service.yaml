name: Deploy Generic Service

on:
  push:
    branches:
      - dev
      - prod-blue
    paths:
      - 'services/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod-blue
      service:
        description: 'Service to deploy'
        required: true
        type: choice
        options:
          - svc1
          - svc2

jobs:
  resolve_env:
    name: Resolve environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.map.outputs.environment }}
    steps:
      - name: Map branch to environment
        id: map
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "environment=${{ inputs.environment }}" >> $GITHUB_OUTPUT
          else
            BRANCH="${{ github.ref_name }}"
            case "$BRANCH" in
              dev) echo "environment=dev" >> $GITHUB_OUTPUT ;;
              prod-blue) echo "environment=prod-blue" >> $GITHUB_OUTPUT ;;
              *) echo "environment=dev" >> $GITHUB_OUTPUT ;;
            esac
          fi

  resolve_targets:
    name: Resolve services to deploy
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.set.outputs.services }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect services
        id: set
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "services=[\"${{ inputs.service }}\"]" >> $GITHUB_OUTPUT
          else
            ALL_SERVICES=("svc1" "svc2")
            CHANGED=()

            for svc in "${ALL_SERVICES[@]}"; do
              if ! git diff --quiet "${{ github.event.before }}" "${{ github.sha }}" -- "services/${svc}/"; then
                CHANGED+=("\"$svc\"")
              fi
            done

            JSON=$(IFS=,; echo "[${CHANGED[*]}]")
            echo "services=$JSON" >> $GITHUB_OUTPUT
            echo "👉 Changed services: $JSON"
          fi

  build_and_deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    needs: [resolve_env, resolve_targets]
    if: needs.resolve_targets.outputs.services != '[]'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.resolve_targets.outputs.services) }}
    environment: ${{ needs.resolve_env.outputs.environment }}
    permissions:
      id-token: write
      contents: read
    env:
      DEPLOY_ENV: ${{ needs.resolve_env.outputs.environment }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
      AWS_GITHUB_ACTIONS_ROLE_ARN: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
      NAMESPACE: ${{ vars.NAMESPACE }}
      ECR_REGISTRY_URL: ${{ vars.ECR_REGISTRY_URL }}

      ECR_REPOSITORY_NAME: ${{ vars[format('ECR_REPOSITORY_NAME_{0}', matrix.service)] }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@d0834ad3a60a024346910e522a81b0002bd37fea
        with:
          role-to-assume: ${{ env.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gh-${{ matrix.service }}-app

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@33f92af657bba1882ab79d8621debd2f6769a0c9

      - name: Build, tag, and push image to Amazon ECR
        run: |
          IMAGE_TAG="${{ github.sha }}"
          FULL_IMAGE_URI="${ECR_REGISTRY_URL}/${ECR_REPOSITORY_NAME}:${IMAGE_TAG}"
          docker build -t "$FULL_IMAGE_URI" -f "./services/${{ matrix.service }}/Dockerfile" .
          docker push "$FULL_IMAGE_URI"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig --name "${EKS_CLUSTER_NAME}" --region "${AWS_REGION}"

      - name: Apply manifests
        working-directory: ./scripts/
        run: |
          echo "Starting deployment tag ${IMAGE_TAG} for ${DEPLOY_ENV}..."
          chmod +x deploy-generic-service.sh
          ./deploy-generic-service.sh "${DEPLOY_ENV}" "${IMAGE_TAG}" "${{ matrix.service }}"
          echo "Deployment completed successfully"