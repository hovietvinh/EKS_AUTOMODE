apiVersion: eks.amazonaws.com/v1
kind: IngressClassParams
metadata:
  name: {{ .Values.alb.ingressClassName | default "alb" }}
spec:
  scheme: {{ .Values.alb.scheme | default "internet-facing" }}
  ipAddressType: {{ .Values.alb.ipAddressType | default "ipv4" }}
  group:
    name: {{ .Values.alb.groupName }}
  subnets:
    ids:
      {{- range splitList "," .Values.alb.subnetIds }}
      - {{ . }}
      {{- end }}
  certificateARNs:
    - {{ .Values.alb.certificateArn | quote }}